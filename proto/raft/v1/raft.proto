syntax = "proto3";

package raft.v1;

option go_package = "github.com/alipourhabibi/raft/gen/go/raft/v1;raftpb";

enum Role {
  UNSPECIFIED = 0;
  FOLLOWER = 1;
  CANDIDATE = 2;
  LEADER = 3;
}

enum EntryType {
  ENTRY_TYPE_COMMAND = 0;
  ENTRY_TYPE_CONFIG = 1; // C_new (phase 2)
  ENTRY_TYPE_CONFIG_JOINT = 2; // C_old,new (phase 1)
}

message ClusterConfig {
  map<string, string> nodes = 3;
}

message Entry {
  string command = 1;
  uint64 term = 2;
  EntryType type = 3;
  ClusterConfig config = 4;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  string from = 5;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool granted = 2;
  string from = 3;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated Entry entries = 5;
  uint64 leader_commit = 6;
  string from = 7;
  uint64 seq = 8;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  string from = 3;
  uint64 prev_log_index = 4;
  uint64 match_index = 5;
  uint64 seq = 6;
}

message SubmitRequest {
  string command = 1;
  string serial_number = 2;
}

message SubmitResponse {
  bool success = 1;
  string leader_id = 2;
}

message ChangeNodesRequest {
  repeated string add_ids = 1;
  repeated string remove_ids = 2;
  map<string, string> add_nodes = 3; // id → url for new nodes
  string from = 4;
}

message ChangeNodesResponse {
  bool success = 1;
  optional string leader_id = 2;
}

message GetRequest {
  string command = 1;
}

message GetResponse {
  string value = 1;
  string leader_id = 2;
  bool status = 3;
}

message Empty {}

service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (Empty);
  rpc RequestVoteReply(RequestVoteResponse) returns (Empty);
  rpc AppendEntries(AppendEntriesRequest) returns (Empty);
  rpc AppendEntriesReply(AppendEntriesResponse) returns (Empty);

  rpc ChangeNodes(ChangeNodesRequest) returns (ChangeNodesResponse);

  // Is used for write operations
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  // Is used for read operations
  rpc Get(GetRequest) returns (GetResponse);
}
